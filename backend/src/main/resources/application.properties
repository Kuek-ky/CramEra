spring.application.name=backend

spring.config.import=optional:file:.env[.properties]

# AWS S3 Configuration
aws.credentials.s3.accessKeyId=${AWS_CREDENTIALS_S3_ACCESS_KEY}
aws.credentials.s3.secretKey=${AWS_CREDENTIALS_S3_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}
aws.s3.bucketName=${AWS_S3_BUCKET_NAME}

# Optional: Increase default max file upload sizes for servlets
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB